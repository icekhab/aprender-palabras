<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <!-- sun -->
  <g transform="translate(36 34)" stroke="#E8B84A" stroke-width="2" stroke-linecap="round">
    <circle cx="0" cy="0" r="9" fill="#F0C95A"/>
    <path d="M0 -16V-20M0 16V20M16 0H20M-16 0H-20M11.5-11.5l2.8-2.8M-11.5 11.5l-2.8 2.8M11.5 11.5l2.8 2.8M-11.5-11.5l-2.8-2.8"/>
  </g>

  <!-- sparkles -->
  <g fill="#E8B84A">
    <path d="M158 38l2.2 5.4 5.4 2.2-5.4 2.2-2.2 5.4-2.2-5.4-5.4-2.2 5.4-2.2z"/>
    <path d="M172 52l1.4 3.4 3.4 1.4-3.4 1.4-1.4 3.4-1.4-3.4-3.4-1.4 3.4-1.4z"/>
  </g>

  <!-- calendar shadow -->
  <rect x="54" y="62" width="92" height="96" rx="14" fill="#C2410C" opacity="0.12"/>

  <!-- calendar body -->
  <rect x="52" y="54" width="92" height="96" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>
  <!-- header -->
  <path d="M52 68c0-7.7 6.3-14 14-14h64c7.7 0 14 6.3 14 14v10H52V68Z" fill="#EA580C"/>
  <!-- rings -->
  <rect x="74" y="46" width="8" height="18" rx="4" fill="#C2410C"/>
  <rect x="114" y="46" width="8" height="18" rx="4" fill="#C2410C"/>

  <!-- day cells -->
  <g fill="#FED7AA">
    <rect x="64" y="86" width="14" height="12" rx="3"/>
    <rect x="84" y="86" width="14" height="12" rx="3"/>
    <rect x="104" y="86" width="14" height="12" rx="3"/>
    <rect x="124" y="86" width="14" height="12" rx="3"/>
    <rect x="64" y="106" width="14" height="12" rx="3"/>
    <rect x="124" y="106" width="14" height="12" rx="3"/>
    <rect x="64" y="126" width="14" height="12" rx="3"/>
    <rect x="84" y="126" width="14" height="12" rx="3"/>
    <rect x="104" y="126" width="14" height="12" rx="3"/>
    <rect x="124" y="126" width="14" height="12" rx="3"/>
  </g>

  <!-- pause cell -->
  <rect x="84" y="104" width="34" height="16" rx="4" fill="#EA580C"/>
  <rect x="93" y="107" width="4" height="10" rx="1.5" fill="#FFF7ED"/>
  <rect x="105" y="107" width="4" height="10" rx="1.5" fill="#FFF7ED"/>

  <!-- leaves left -->
  <g fill="#65A30D" opacity="0.9">
    <ellipse cx="40" cy="148" rx="7" ry="14" transform="rotate(-35 40 148)"/>
    <ellipse cx="52" cy="156" rx="6" ry="12" transform="rotate(-15 52 156)"/>
    <ellipse cx="34" cy="160" rx="5" ry="11" transform="rotate(-50 34 160)"/>
  </g>
  <!-- leaves right -->
  <g fill="#65A30D" opacity="0.9">
    <ellipse cx="160" cy="148" rx="7" ry="14" transform="rotate(35 160 148)"/>
    <ellipse cx="148" cy="156" rx="6" ry="12" transform="rotate(15 148 156)"/>
    <ellipse cx="166" cy="160" rx="5" ry="11" transform="rotate(50 166 160)"/>
